
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="rating-card">
        <div class="emoji">⭐</div>
        <h1>Rate Your Experience</h1>
        <p class="subtitle">How was your experience with us?</p>

        <div class="stars" id="stars" aria-label="Choose a rating">
            <button class="star" type="button" data-value="1" aria-label="1 star">★</button>
            <button class="star" type="button" data-value="2" aria-label="2 stars">★</button>
            <button class="star" type="button" data-value="3" aria-label="3 stars">★</button>
            <button class="star" type="button" data-value="4" aria-label="4 stars">★</button>
            <button class="star" type="button" data-value="5" aria-label="5 stars">★</button>
        </div>

        <p id="ratingText" aria-live="polite">No rating selected yet</p>

        <button id="resetBtn" class="reset-btn" type="button">Reset Rating</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
